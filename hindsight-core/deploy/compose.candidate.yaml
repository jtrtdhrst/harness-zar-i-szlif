      HINDSIGHT_API_LLM_DEFAULT_HEADERS: "${HINDSIGHT_API_LLM_DEFAULT_HEADERS:?supply via Coolify environment}"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: "${HINDSIGHT_API_EMBEDDINGS_PROVIDER:?supply via Coolify environment}"
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: "${HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL:?supply via Coolify environment}"
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: "${HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL:?supply via Coolify environment}"
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: "${HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY:?supply via Coolify environment}"
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: "${HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS:?supply via Coolify environment}"
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BATCH_SIZE: "${HINDSIGHT_API_EMBEDDINGS_OPENAI_BATCH_SIZE:?supply via Coolify environment}"
      HINDSIGHT_API_RERANKER_PROVIDER: "${HINDSIGHT_API_RERANKER_PROVIDER:?supply via Coolify environment}"
