      HINDSIGHT_API_RECALL_PREFER_OBSERVATIONS: "${HINDSIGHT_API_RECALL_PREFER_OBSERVATIONS:?supply via Coolify environment}"
      HINDSIGHT_API_MCP_INSTRUCTIONS: "${HINDSIGHT_API_MCP_INSTRUCTIONS:?supply via Coolify environment}"
      HINDSIGHT_CP_ACCESS_KEY: "${HINDSIGHT_CP_ACCESS_KEY:?supply via Coolify environment}"
      HINDSIGHT_API_ENABLE_BANK_CONFIG_API: "${HINDSIGHT_API_ENABLE_BANK_CONFIG_API:?supply via Coolify environment}"
    volumes:
