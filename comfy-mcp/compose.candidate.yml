services:
  comfy-mcp:
    image: "${PINNED_IMAGE_COMFY_MCP_1:?Set reviewed immutable OCI digest}"
    # pull policy withheld; release must use approved OCI digest
    restart: unless-stopped
    expose:
      - '9100'
    networks:
      coolify:
        aliases:
          - comfy-mcp
    environment:
      COMFYUI_URL: 'http://comfyui:8188'
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"require('net').connect(9100,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  coolify:
    external: true
