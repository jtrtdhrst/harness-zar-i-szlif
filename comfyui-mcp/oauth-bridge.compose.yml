services:
  bridge:
    image: local/comfyui-mcp:0.52.206-chatfiles5
    pull_policy: never
    container_name: comfy-mcp-access-bridge
    command: ["node", "/srv/server.mjs"]
    env_file: /data/coolify/services/kkhfw0napmeaqewgdirwhc1h/.env
    environment:
      CF_ACCESS_ISSUER: https://flashautomate.cloudflareaccess.com
      CF_ACCESS_AUD: 86fe11a8d3407d8624da3536066e7acd6fda93309ddd5c9c9c5a26d0a17c98e0
      MCP_UPSTREAM: http://comfy-mcp:9100
      LISTEN_PORT: "9101"
    networks: [coolify]
    volumes:
      - ./server.mjs:/srv/server.mjs:ro
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    pids_limit: 80
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9101/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  coolify:
    external: true
