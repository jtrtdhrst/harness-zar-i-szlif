# opik-mcp public proxy (mcp-opik.kompaszbiorek.pl) — injects a dummy bearer so
# clients connect with NO Authorization header. OSS Opik backend enforces no
# auth, so the bearer is accepted and forwarded harmlessly.
server {
  listen 8080;
  # Internal-only Cloudflare signed Access JWT verification. No user-supplied
  # Authorization is trusted; the identity assertion is cryptographically checked.
  location = /__access_verify {
    internal;
    proxy_pass http://access-guard:8088/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_connect_timeout 2s;
    proxy_read_timeout 6s;
  }
  location / {
    auth_request /__access_verify;
    # Allow Coolify tunnel/service network only; deny direct public-port access.
    allow 172.19.0.0/16;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://opik-mcp:8080;
    proxy_http_version 1.1;
    proxy_set_header Host mcp-opik.kompaszbiorek.pl;
    proxy_set_header Authorization "Bearer local-public";
    # Never leak Cloudflare Access identity assertions or cookies to Opik.
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Cf-Access-Authenticated-User-Email "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
