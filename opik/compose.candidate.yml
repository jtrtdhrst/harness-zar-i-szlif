services:
  mysql:
    image: "${PINNED_IMAGE_OPIK_1:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    expose:
    - '3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opik}
      MYSQL_USER: ${MYSQL_USER:-opik}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - --silent
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    volumes:
    - opik-staging-mysql:/var/lib/mysql
  redis:
    image: "${PINNED_IMAGE_OPIK_2:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    expose:
    - '6379'
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '6379'
      interval: 2s
      timeout: 4s
      retries: 20
      start_period: 30s
    volumes:
    - opik-staging-redis-data:/data
  zookeeper:
    image: "${PINNED_IMAGE_OPIK_3:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    user: root
    expose:
    - '2181'
    entrypoint:
    - /bin/bash
    - -c
    - 'mkdir -p /bitnami/zookeeper/data

      chown -R zookeeper:zookeeper /bitnami/zookeeper

      exec gosu zookeeper /docker-entrypoint.sh zkServer.sh start-foreground

      '
    environment:
      JVMFLAGS: -Xmx512m
      ZOO_4LW_COMMANDS_WHITELIST: srvr,ruok
      ZOO_DATA_DIR: /bitnami/zookeeper/data
      ZOO_DATA_LOG_DIR: /bitnami/zookeeper/data
    healthcheck:
      test:
      - CMD-SHELL
      - echo ruok | nc localhost 2181 | grep -q imok
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    volumes:
    - opik-staging-zookeeper:/bitnami/zookeeper
  clickhouse:
    image: "${PINNED_IMAGE_OPIK_4:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    expose:
    - '8123'
    - '9000'
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-opik}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-opik}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    configs:
    - source: opik_clickhouse_macros
      target: /etc/clickhouse-server/config.d/99-opik-macros.xml
    volumes:
    - opik-staging-clickhouse-data:/var/lib/clickhouse
    - opik-staging-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:8123/ping
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      zookeeper:
        condition: service_healthy
  minio:
    image: "${PINNED_IMAGE_OPIK_5:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    expose:
    - '9000'
    - '9090'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
    - /bin/sh
    - -c
    command:
    - mkdir -p /data && exec minio server --console-address ':9090' /data
    healthcheck:
      test:
      - CMD-SHELL
      - MC_HOST_local=http://localhost:9000 mc ready local
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    volumes:
    - opik-staging-minio-data:/data
  backend:
    image: "${PINNED_IMAGE_OPIK_6:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    expose:
    - '8080'
    - '3003'
    command:
    - bash
    - -c
    - ./run_db_migrations.sh && ./provision_agent_insights_readonly_user.sh && ./entrypoint.sh
    environment:
      STATE_DB_PROTOCOL: jdbc:mysql://
      STATE_DB_URL: mysql:3306/opik?createDatabaseIfNotExist=true&rewriteBatchedStatements=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      STATE_DB_DATABASE_NAME: opik
      STATE_DB_USER: ${MYSQL_USER:-opik}
      STATE_DB_PASS: ${MYSQL_PASSWORD}
      ANALYTICS_DB_MIGRATIONS_URL: jdbc:clickhouse://clickhouse:8123
      ANALYTICS_DB_MIGRATIONS_USER: ${CLICKHOUSE_USER:-opik}
      ANALYTICS_DB_MIGRATIONS_PASS: ${CLICKHOUSE_PASSWORD}
      ANALYTICS_DB_PROTOCOL: HTTP
      ANALYTICS_DB_HOST: clickhouse
      ANALYTICS_DB_PORT: 8123
      ANALYTICS_DB_DATABASE_NAME: ${CLICKHOUSE_DB:-opik}
      ANALYTICS_DB_USERNAME: ${CLICKHOUSE_USER:-opik}
      ANALYTICS_DB_PASS: ${CLICKHOUSE_PASSWORD}
      ANALYTICS_DB_READ_ONLY_FREEFORM_SQL_USER: ${ANALYTICS_DB_READ_ONLY_FREEFORM_SQL_USER:-comet_readonly_freeform_sql_user}
      ANALYTICS_DB_READ_ONLY_FREEFORM_SQL_PASS: ${ANALYTICS_DB_READ_ONLY_FREEFORM_SQL_PASS}
      ANALYTICS_DB_HTTP_HEADERS_PROGRESS_INTERVAL_MS: '3000'
      JAVA_OPTS: -Dliquibase.propertySubstitutionEnabled=true -XX:+UseG1GC -XX:MaxRAMPercentage=80.0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-s7a4rwqbij7w4fxlnauriblo:6379/
      OPIK_OTEL_SDK_ENABLED: 'false'
      OPIK_USAGE_REPORT_ENABLED: ${OPIK_USAGE_REPORT_ENABLED:-true}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IS_MINIO: 'true'
      S3_URL: http://minio:9000
      PYTHON_EVALUATOR_URL: http://python-backend:8000
      TOGGLE_OLLIE_ENABLED: 'false'
      TOGGLE_CUSTOM_CHARTS_ENABLED: 'false'
      TOGGLE_OPIK_AI_ENABLED: 'false'
      TOGGLE_GUARDRAILS_ENABLED: 'false'
      TOGGLE_WELCOME_WIZARD_ENABLED: 'true'
      TOGGLE_ANNOTATION_QUEUE_AUTOMATION_ENABLED: 'true'
      LLM_MODEL_REGISTRY_DEFAULT_RESOURCE: llm-models-default.yaml
      LLM_MODEL_REGISTRY_REMOTE_ENABLED: 'false'
      LLM_PROVIDER_TOKEN_AUTH_DESTINATION_GUARD: "${LLM_PROVIDER_TOKEN_AUTH_DESTINATION_GUARD:?Set runtime secret}"
      LLM_PROVIDER_DESTINATION_GUARD: relaxed
      LLM_PROVIDER_DESTINATION_SCHEME: plaintext_or_tls
      LLM_PROVIDER_VIDEO_URL_DESTINATION_GUARD: relaxed
      CORS: 'false'
      ATTACHMENTS_STRIP_MIN_SIZE: '256000'
      JACKSON_MAX_STRING_LENGTH: '104857600'
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health-check
      interval: 10s
      timeout: 10s
      retries: 120
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    tmpfs:
    - /tmp
  python-backend:
    image: "${PINNED_IMAGE_OPIK_7:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    privileged: true
    expose:
    - '8000'
    environment:
      OPIK_OTEL_SDK_ENABLED: 'false'
      PYTHON_CODE_EXECUTOR_IMAGE_TAG: 2.2.121
      PYTHON_CODE_EXECUTOR_STRATEGY: ${PYTHON_CODE_EXECUTOR_STRATEGY:-process}
      PYTHON_CODE_EXECUTOR_CONTAINERS_NUM: 5
      PYTHON_CODE_EXECUTOR_EXEC_TIMEOUT_IN_SECS: 3
      PYTHON_CODE_EXECUTOR_ALLOW_NETWORK: 'false'
      PYTHON_CODE_EXECUTOR_CPU_SHARES: 512
      PYTHON_CODE_EXECUTOR_MEM_LIMIT: 256m
      OPIK_VERSION: 2.2.121
      OPIK_REVERSE_PROXY_URL: http://frontend:5173/api
      PYTHON_BACKEND_PORT: '8000'
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-s7a4rwqbij7w4fxlnauriblo:6379/0
      RQ_WORKER_ENABLED: ${RQ_WORKER_ENABLED:-true}
      OPTSTUDIO_MAX_CONCURRENT_JOBS: ${OPTSTUDIO_MAX_CONCURRENT_JOBS:-5}
      OPTSTUDIO_LOG_LEVEL: ${OPTSTUDIO_LOG_LEVEL:-INFO}
      OPTSTUDIO_LLM_MAX_TOKENS: ${OPTSTUDIO_LLM_MAX_TOKENS:-8192}
      RQ_WORKER_TTL_FAILURE: ${RQ_WORKER_TTL_FAILURE:-86400}
      OPIK_URL_OVERRIDE: http://backend:8080
    tmpfs:
    - /var/lib/docker
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; socket.create_connection(('127.0.0.1',8000),2).close()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  frontend:
    image: "${PINNED_IMAGE_OPIK_8:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    expose:
    - '5173'
    environment:
      OPIK_VERSION: 2.2.121
      NGINX_PORT: '5173'
      NGINX_CONF_SUFFIX: local
      OTEL_TRACE: 'off'
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail http://localhost:5173/health
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    volumes:
    - type: bind
      source: /data/coolify/mission/opik-staging-frontend/nginx_default_local.conf
      target: /etc/nginx/templates/default.conf.template
      read_only: true
    ports:
    - 0.0.0.0:5173:5173
volumes:
  opik-staging-mysql: null
  opik-staging-clickhouse-data: null
  opik-staging-clickhouse-logs: null
  opik-staging-zookeeper: null
  opik-staging-redis-data: null
  opik-staging-minio-data: null

configs:
  opik_clickhouse_macros:
    content: |
      <clickhouse>
        <macros>
          <shard>1</shard>
          <replica>clickhouse</replica>
        </macros>
        <zookeeper>
          <node>
            <host>zookeeper</host>
            <port>2181</port>
          </node>
        </zookeeper>
      </clickhouse>
