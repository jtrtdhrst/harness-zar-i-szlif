services:
  proxy:
    image: "${PINNED_IMAGE_OPIK_MCP_1:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    depends_on:
      - opik-mcp
    ports:
      - '127.0.0.1:18082:8080'
    volumes:
      - '/home/opencode/projects/opik/mcp-proxy.conf:/etc/nginx/conf.d/default.conf:ro'
    healthcheck:
      test:
        - CMD-SHELL
        - 'nc -z 127.0.0.1 8080'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  opik-mcp:
    image: "${PINNED_IMAGE_OPIK_MCP_2:?Set reviewed immutable OCI digest}"
    # pull policy withheld; release must use approved OCI digest
    restart: unless-stopped
    expose:
      - '8080'
    environment:
      OPIK_MCP_HOST: '${OPIK_MCP_HOST}'
      OPIK_MCP_PORT: '${OPIK_MCP_PORT}'
      OPIK_MCP_ALLOWED_HOSTS: '${OPIK_MCP_ALLOWED_HOSTS}'
      OPIK_MCP_LOG_LEVEL: '${OPIK_MCP_LOG_LEVEL}'
      OPIK_URL: '${OPIK_URL}'
      OPIK_MCP_TRANSPORT: '${OPIK_MCP_TRANSPORT}'
      OPIK_MCP_ALLOWED_ORIGINS: '${OPIK_MCP_ALLOWED_ORIGINS}'
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import socket; socket.create_connection((''127.0.0.1'',8080),2).close()"'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  access-guard:
    image: "${PINNED_IMAGE_OPIK_MCP_3:?Set reviewed immutable OCI digest}"
    # pull policy withheld; release must use approved OCI digest
    restart: unless-stopped
    expose:
      - '8088'
    environment:
      CF_ACCESS_ISSUER: 'https://flashautomate.cloudflareaccess.com'
      CF_ACCESS_AUD: '01d6ca2e4ad1fc0cdb0d07286b1ae02ff0cf0ddfb006f4f7f6d554eda3f34a8f'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz',timeout=3)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
  mcp:
    image: "${PINNED_IMAGE_OPIK_MCP_4:?Set reviewed immutable OCI digest}"
