services:
  qdrant-mcp:
    labels: {}
    image: "${PINNED_IMAGE_QDRANT_MCP_1:?Set reviewed immutable OCI digest}"
    # pull policy withheld; release must use approved OCI digest
    restart: unless-stopped
    command:
    - python
    - server.py
    expose:
    - '8000'
    networks:
      coolify:
        aliases:
        - mcp-qdrant-staging
        - qa3jcxpcbx7vgh1exbbaacnu-20261029T223054
    environment:
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      COLLECTION_NAME: ${COLLECTION_NAME}
      DENSE_MODEL: ${DENSE_MODEL}
      SPARSE_MODEL: ${SPARSE_MODEL}
      MCP_TRANSPORT: ${MCP_TRANSPORT}
      QDRANT_MCP_TOKEN: ${QDRANT_MCP_TOKEN}
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import socket; socket.create_connection(('127.0.0.1',8000),2).close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
networks:
  coolify:
    external: true
