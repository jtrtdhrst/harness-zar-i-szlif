name: Opik run enricher checks
on:
  pull_request:
    paths: ['workers/opik-run-enricher/**', '.github/workflows/opik-run-enricher.yml']
  push:
    branches: [main]
    paths: ['workers/opik-run-enricher/**', '.github/workflows/opik-run-enricher.yml']
concurrency:
  group: opik-run-enricher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safe-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest -q test_worker
        working-directory: opik-run-enricher
      - run: python3 -m py_compile worker.py
        working-directory: opik-run-enricher
