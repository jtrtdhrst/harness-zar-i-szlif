name: Multica MCP CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "multica-mcp/**"
      - ".github/workflows/multica-mcp-ci.yml"
  workflow_dispatch:

concurrency:
  group: multica-mcp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-multica-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Keep the status check visible for every PR, including unrelated ones.
      # A GitHub API error must fail this check, never silently skip tests.
      - name: Detect Multica MCP changes (fail closed)
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -Eq '^(multica-mcp/|\.github/workflows/multica-mcp-ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Unrelated PR; Multica MCP unit tests are not applicable."
          fi
      - name: Check out reviewed source
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test Multica MCP adapter
        if: steps.scope.outputs.relevant == 'true'
        working-directory: multica-mcp
        run: npm test
      # The currently shipped Dockerfile is used by Coolify. Test the actual
      # image build and curl-driven managed HTTP probe, not only Node unit tests.
      # This runs on an isolated GitHub-hosted runner, never a privileged
      # production self-hosted runner with Docker/root/secret access.
      - name: Build production-equivalent Docker image
        if: steps.scope.outputs.relevant == 'true'
        run: docker build --file multica-mcp/Dockerfile --tag local/multica-mcp-ci:verified multica-mcp
      - name: Container curl and non-root HTTP health probe (positive and negative)
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh local/multica-mcp-ci:verified -ec '
            test "$(id -u)" -ne 0
            command -v curl
            curl --version >/dev/null
            if curl --fail --silent --max-time 2 http://127.0.0.1:59999/health >/dev/null; then
              echo "unexpected healthy unavailable endpoint" >&2
              exit 1
            fi
          '
          cid="$(docker run -d local/multica-mcp-ci:verified)"
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$cid" curl --fail --silent --max-time 2 http://127.0.0.1:3000/health >/dev/null; then
              echo "container-managed curl health probe PASS"
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid" >&2
          exit 1
