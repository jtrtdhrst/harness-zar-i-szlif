name: RepoWise Publisher E2E

# A disposable GitHub-hosted runner, NOT the host's insecure self-hosted
# PR runner. No Docker socket, checkout write token or production credentials.
on:
  pull_request:
    paths:
      - "ops/repowise/deployment_evidence_mcp.py"
      - "ops/repowise/test_deployment_evidence_mcp.py"
      - ".github/workflows/repowise-publisher-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repowise-publisher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-episode-mcp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned RepoWise MCP runtime (no model API required)
        run: |
          python -m pip install --disable-pip-version-check "repowise==0.60.1" "mcp==1.30.0"
      - name: Test authentic stdio and HTTP MCP + Git and SQLite scope boundaries
        working-directory: ops/repowise
        env:
          REPOWISE_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          python -m unittest -v test_deployment_evidence_mcp
