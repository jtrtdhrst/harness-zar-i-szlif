name: Opik telemetry source regression
on:
  pull_request:
    paths:
      - 'ops/observability/opik/**'
      - '.github/workflows/opik-telemetry-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tracked files
        run: python -m compileall -q ops/observability/opik
      - name: Price-model and execution-integrity tests
        run: |
          python ops/observability/opik/value_metrics.py
          python ops/observability/opik/execution_hygiene.py
