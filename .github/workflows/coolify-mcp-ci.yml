name: Coolify MCP owned source build and E2E
on:
  pull_request:
    paths:
      - 'coolify-mcp/**'
      - '.github/workflows/coolify-mcp-ci.yml'
      - 'scripts/service-coverage.json'
  push:
    branches: [main]
    paths:
      - 'coolify-mcp/**'
      - '.github/workflows/coolify-mcp-ci.yml'
      - 'scripts/service-coverage.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: coolify-mcp/package-lock.json
      - name: Install owned upstream
        working-directory: coolify-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build owned runtime
        working-directory: coolify-mcp
        run: npm run build
      - name: Coolify MCP E2E
        working-directory: coolify-mcp
        run: npm test -- --runInBand
      - name: Release source coverage
        run: python3 scripts/check_service_coverage.py

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./coolify-mcp
          file: ./coolify-mcp/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coolify-mcp:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record exact image digest (not a deployment)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          echo "Owned Coolify MCP image: ghcr.io/${{ github.repository_owner }}/coolify-mcp@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Production promotion is separately signed/authorized; image publication is not deployment." >> "$GITHUB_STEP_SUMMARY"
