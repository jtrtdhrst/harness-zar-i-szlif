name: Release Lanes Policy

# The root-folder coverage check is part of check-release-lanes.py.
# Run it on EVERY PR and every main commit, including changes to newly added
# service folders; a path filter here would leave unclassified roots unchecked.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-lanes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-release-lanes:
    # PR-controlled source is untrusted: never run it on the Docker-group local runner.
    # Only reviewed main push/manual jobs may use local-build; hosted PR failures
    # remain fail-closed until billing or an isolated runner is genuinely ready.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","linux","x64","local-build"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release contract, every root disposition and regressions
        run: python scripts/check-release-lanes.py --self-test
      - name: Guard against non-MCP automatic image builds
        run: python3 -m unittest discover -s scripts -p test_non_mcp_build_guard.py -v
