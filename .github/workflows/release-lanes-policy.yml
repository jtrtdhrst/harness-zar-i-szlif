name: Release Lanes Policy

# Do not run PR-controlled YAML on the persistent self-hosted runner.
# Premerge exact-source validation is independent/rootless; run the complete
# path and release-policy contract on trusted main pushes or main dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-lanes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release-lanes:
    # Only the reviewed main ref may execute on this persistent runner.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, local-build]
    timeout-minutes: 10
    steps:
      - name: Trusted main-only runner admission
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$GITHUB_EVENT_NAME" == 'push' || "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          test "$GITHUB_REPOSITORY" = 'miloszspyrka-code/harness-zar-i-szlif'
          test "$(id -un)" = actions-zis
          ! test -w /var/run/docker.sock
          ! test -r /opt/zis-actions-runner/.credentials
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release contract, every root disposition and regressions
        run: python scripts/check-release-lanes.py --self-test
      - name: Guard against non-MCP automatic image builds
        run: python3 -m unittest discover -s scripts -p test_non_mcp_build_guard.py -v
      # Catch truncated or malformed security sources before approving a merge.
      # The projector regression is synthetic and requires no model credentials.
      - name: Validate Hermes Landlock syntax and scoped-credential regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ops/harness/landlock/zari213-hermes-task-landlock.py \
            ops/harness/landlock/test_role_acl_canary.py
          if [[ -e ops/harness/credentials/role_env_projector.py ]]; then
            python3 -m py_compile \
              ops/harness/credentials/role_env_projector.py \
              ops/harness/credentials/test_role_env_projector.py \
              ops/harness/credentials/test_provider_acl_canary.py
            python3 -m unittest discover -s ops/harness/credentials -p 'test_role_env_projector.py' -v
          fi
      - name: Set up Node.js 24 for Multica MCP adapter
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test Multica MCP adapter on trusted main
        working-directory: multica-mcp
        env:
          MULTICA_MCP_HOME: ${{ runner.temp }}/multica-mcp-ci-home
        run: npm test
