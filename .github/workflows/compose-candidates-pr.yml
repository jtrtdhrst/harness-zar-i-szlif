name: Harness Compose Candidates PR Gate

# Never execute unreviewed PR code on the permanent self-hosted production runner.
on:
  pull_request:
    paths:
      - 'ops/service-build-roots.json'
      - 'ops/service-deployment-roots.json'
      - 'scripts/test_service_build_roots.py'
      - 'scripts/test_service_deployment_roots.py'
      - 'scripts/select_service_deployments.py'
      - '**/deploy/**'
      - '.github/workflows/compose-candidates-pr.yml'

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exact 31-root and 20-candidate ownership contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_service_build_roots.py -v
          python3 -m unittest discover -s scripts -p test_service_deployment_roots.py -v
      - name: Validate all 20 candidate Compose configurations without deploying
        run: |
          set -euo pipefail
          docker compose version
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          rows = json.loads(Path("ops/service-deployment-roots.json").read_text())["resources"]
          assert len(rows) == 20
          for row in rows:
              source = row["versioned_compose"]
              assert source and Path(source).is_file(), row["id"]
              subprocess.run(
                  ["docker", "compose", "-f", source, "config", "--no-interpolate", "--quiet"],
                  check=True,
                  timeout=20,
              )
              print("CANDIDATE_COMPOSE_OK", row["id"])
          PY

      - name: Synthetic positive/negative interpolation (no deploy or secrets)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          rows = json.loads(Path("ops/service-deployment-roots.json").read_text())["resources"]
          expr = re.compile(r"\$\{([A-Za-z_][A-Za-z0-9_]*):\?[^}]*\}")
          negative_count = 0
          for row in rows:
              path = row["versioned_compose"]
              names = set(expr.findall(Path(path).read_text()))
              env = {"PATH": os.environ["PATH"]}
              for name in names:
                  if "DIGEST" in name:
                      value = "example.invalid/fixture@sha256:" + "0" * 64
                  elif "BIND" in name or "MOUNT" in name:
                      value = "/tmp/fixture-data"
                  elif "PORT" in name:
                      value = "1234"
                  else:
                      value = "fixture"
                  env[name] = value
              args = ["docker", "compose", "-f", path, "config", "--quiet"]
              subprocess.run(args, env=env, check=True, timeout=20)
              if names:
                  negative_count += 1
                  result = subprocess.run(
                      args, env={"PATH": os.environ["PATH"]},
                      capture_output=True, text=True, timeout=20
                  )
                  assert result.returncode != 0, "FAIL_OPEN: " + row["id"]
              print("SYNTHETIC_CONFIG_OK", row["id"])
          assert negative_count == 16, f"expected 16 required env candidates: {negative_count}"
          PY
