name: Playwright MCP source CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp/playwright-mcp/**'
      - '.github/workflows/playwright-mcp-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/playwright-mcp/**'
      - '.github/workflows/playwright-mcp-ci.yml'

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp/playwright-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run local session and watchdog regression fixtures
        run: node --test tests/idle-proxy.test.mjs tests/smoke-chromium-watchdog.test.mjs
