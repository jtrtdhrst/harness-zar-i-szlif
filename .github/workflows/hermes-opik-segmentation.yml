name: Hermes Opik native segmentation regression
on:
  pull_request:
    paths:
      - "integrations/hermes-paperclip/observability/**"
      - ".github/workflows/hermes-opik-segmentation.yml"
  push:
    branches: [main]
    paths:
      - "integrations/hermes-paperclip/observability/**"
      - ".github/workflows/hermes-opik-segmentation.yml"
permissions:
  contents: read
jobs:
  segmentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify lifecycle segmentation + 14-role reversible rollout
        run: python -m unittest discover -s integrations/hermes-paperclip/observability/tests -v
      - name: Python syntax of deployment code
        run: python -m py_compile integrations/hermes-paperclip/observability/{apply_opik_segmentation,rollout}.py
