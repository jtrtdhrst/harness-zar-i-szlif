name: GitHub Ops MCP CI

# Source-only verification. Production releases remain governed by the existing
# reviewed, SHA-bound Harness/Multica/Coolify release controls.
on:
  pull_request:
    branches: [main]
    paths:
      - 'github-mcp/**'
      - 'ops/harness/credentials/multica-zar-github-app-refresh.py'
      - 'ops/harness/credentials/github-ops-token-project.py'
      - 'ops/harness/credentials/multica-git-credential-broker.py'
      - 'ops/harness/credentials/test_zari213_daemon_cache_reader.py'
      - 'ops/harness/credentials/zari213-codex-role-broker.py'
      - 'ops/harness/credentials/test_zari213_codex_role_broker.py'
      - 'ops/harness/landlock/zari213-hermes-task-landlock.py'
      - 'ops/harness/landlock/test_zari213_vision_cache.py'
      - 'ops/harness/release/multica_native_release_gate.py'
      - 'ops/harness/release/test_zari213_release_gate.py'
      - 'ops/harness/credentials/README-zari213-daemon-cache-reader.md'
      - 'ops/harness/credentials/test_zari263_broker_scope.py'
      - 'ops/harness/credentials/test_zari263_projector_scope.py'
      - 'scripts/service-coverage.json'
      - 'scripts/check_service_coverage.py'
      - 'ops/multica/patches/zari213e-fresh-checkout-scope.patch'
      - '.github/workflows/github-ops-mcp-ci.yml'
  push:
    branches: [main]
    paths:
      - 'github-mcp/**'
      - 'ops/harness/credentials/multica-zar-github-app-refresh.py'
      - 'ops/harness/credentials/github-ops-token-project.py'
      - 'ops/harness/credentials/multica-git-credential-broker.py'
      - 'ops/harness/credentials/test_zari213_daemon_cache_reader.py'
      - 'ops/harness/credentials/zari213-codex-role-broker.py'
      - 'ops/harness/credentials/test_zari213_codex_role_broker.py'
      - 'ops/harness/landlock/zari213-hermes-task-landlock.py'
      - 'ops/harness/landlock/test_zari213_vision_cache.py'
      - 'ops/harness/release/multica_native_release_gate.py'
      - 'ops/harness/release/test_zari213_release_gate.py'
      - 'ops/harness/credentials/README-zari213-daemon-cache-reader.md'
      - 'ops/harness/credentials/test_zari263_broker_scope.py'
      - 'ops/harness/credentials/test_zari263_projector_scope.py'
      - 'scripts/service-coverage.json'
      - 'scripts/check_service_coverage.py'
      - 'ops/multica/patches/zari213e-fresh-checkout-scope.patch'
      - '.github/workflows/github-ops-mcp-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Test and build GitHub Ops MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax validation
        run: node --check github-mcp/server.mjs
      - name: Validate GitHub App credential broker source
        run: |
          python3 -m py_compile ops/harness/credentials/multica-zar-github-app-refresh.py ops/harness/credentials/github-ops-token-project.py
          python3 -m py_compile ops/harness/credentials/multica-git-credential-broker.py
      - name: Role-scoped Codex broker negative and quota regressions
        run: |
          python3 -m pip install --disable-pip-version-check aiohttp==3.14.5
          python3 ops/harness/credentials/test_zari213_codex_role_broker.py -v
      - name: Git credential broker identity and isolation regressions
        run: python3 ops/harness/credentials/test_zari213_daemon_cache_reader.py -q
      - name: Verify task-role OAuth isolation and cache ACL regressions
        run: python3 -m unittest discover -s ops/harness/landlock -p 'test_zari213_*.py' -v
      - name: Verify native release gate owner, HOLD and SHA review restrictions
        run: python3 -m unittest discover -s ops/harness/release -p 'test_zari213_*.py' -v
      - name: Scoped repository grants and credential broker negatives
        run: python3 ops/harness/credentials/test_zari263_broker_scope.py -q
      - name: Verify MCP root coverage and separate writer grant projection
        run: |
          python3 scripts/check_service_coverage.py
          python3 ops/harness/credentials/test_zari263_projector_scope.py -q
      # The token-file tests intentionally require root-owned 0640 files.
      # Run inside the unprivileged BuildKit sandbox (root in the build stage),
      # not as host root or by relaxing production credential checks.
      - name: MCP HTTP regression tests (isolated image build)
        run: docker build --target verify -t github-ops-mcp:verify ./github-mcp
      - name: Build production Dockerfile
        run: docker build -t github-ops-mcp:ci ./github-mcp
      - name: Validate packaged server syntax
        run: docker run --rm --entrypoint node github-ops-mcp:ci --check /app/server.mjs

  verify-daemon-patch:
    name: Verify pinned Multica daemon isolation patch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch immutable upstream Multica baseline and apply patch
        shell: bash
        env:
          BASE_SHA: b1ea927def6490c43bedff537b6f4ed9a47fa828
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/zari213-multica"
          mkdir -p "${source_dir}"
          git -C "${source_dir}" init --quiet
          git -C "${source_dir}" -c protocol.version=2 fetch --no-tags --depth=1 https://github.com/multica-ai/multica.git "${BASE_SHA}"
          git -C "${source_dir}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${source_dir}" rev-parse HEAD)" = "${BASE_SHA}"
          patch_file="${GITHUB_WORKSPACE}/ops/multica/patches/zari213e-fresh-checkout-scope.patch"
          git -C "${source_dir}" apply --check "${patch_file}"
          git -C "${source_dir}" apply "${patch_file}"
          echo "ZARI213_GO_SOURCE=${source_dir}/server" >> "${GITHUB_ENV}"
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: false
      - name: Run daemon positive and negative scope and checkout tests
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          cd "${ZARI213_GO_SOURCE}"
          go version
          go test -count=1 -run 'TestCreateWorktreeFreshFailsWhenFetchFails|TestCreateWorktreeReportsFailedFetch|TestLocalCloneArgsNeverHardlinkSharedCache|TestLocalCloneArgsNoHardlinksAllPlatforms|TestIsolatedCheckoutCloneWithoutHardlinksIsIndependent|TestCreateWorktreeWithIsolatedGitMetadata' ./internal/daemon/repocache
          go test -count=1 -run 'TestProjectRepoScopeFailClosed|TestRepoCheckout|TestZARI213|TestRepoCheckoutModeFor' ./internal/daemon
          go test -count=1 -run TestCodexManagedMcpOAuthFalseCompatibility ./pkg/agent
      - name: Build source-pinned Multica daemon and CLI candidate (no installation)
        shell: bash
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          cd "${ZARI213_GO_SOURCE}"
          mkdir -p "${RUNNER_TEMP}/zari213-candidate"
          go build -trimpath -ldflags='-buildid=' -o "${RUNNER_TEMP}/zari213-candidate/multica" ./cmd/multica
          test -x "${RUNNER_TEMP}/zari213-candidate/multica"
          "${RUNNER_TEMP}/zari213-candidate/multica" --version
          cd "${RUNNER_TEMP}/zari213-candidate"
          sha256sum multica > SHA256SUMS
          printf 'UPSTREAM_BASE_SHA=b1ea927def6490c43bedff537b6f4ed9a47fa828\nPR_HEAD_SHA=%s\n' "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" > PROVENANCE.txt
      - name: Retain candidate checksum and executable for gated operator release
        uses: actions/upload-artifact@v4
        with:
          name: zari213-daemon-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/zari213-candidate/
          if-no-files-found: error
          retention-days: 7
