name: GitHub Ops MCP CI

# Source-only verification. Production releases remain governed by the existing
# reviewed, SHA-bound Harness/Multica/Coolify release controls.
on:
  pull_request:
    branches: [main]
    paths:
      - 'github-ops-mcp/**'
      - 'ops/harness/credentials/multica-zar-github-app-refresh.py'
      - 'ops/harness/credentials/github-ops-token-project.py'
      - '.github/workflows/github-ops-mcp-ci.yml'
  push:
    paths:
      - 'github-ops-mcp/**'
      - 'ops/harness/credentials/multica-zar-github-app-refresh.py'
      - 'ops/harness/credentials/github-ops-token-project.py'
      - '.github/workflows/github-ops-mcp-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Test and build GitHub Ops MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax validation
        run: node --check github-ops-mcp/server.mjs
      - name: Validate GitHub App credential broker source
        run: |
          python3 -m py_compile ops/harness/credentials/multica-zar-github-app-refresh.py ops/harness/credentials/github-ops-token-project.py
      # The token-file tests intentionally require root-owned 0640 files.
      # Run inside the unprivileged BuildKit sandbox (root in the build stage),
      # not as host root or by relaxing production credential checks.
      - name: MCP HTTP regression tests (isolated image build)
        run: docker build --target verify -t github-ops-mcp:verify ./github-ops-mcp
      - name: Build production Dockerfile
        run: docker build -t github-ops-mcp:ci ./github-ops-mcp
      - name: Validate packaged server syntax
        run: docker run --rm --entrypoint node github-ops-mcp:ci --check /app/server.mjs
