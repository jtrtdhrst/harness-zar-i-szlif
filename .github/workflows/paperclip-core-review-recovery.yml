name: Paperclip Core pre-dispatch review recovery overlay
on:
  pull_request:
    paths:
      - 'integrations/paperclip-core-review-recovery/**'
      - '.github/workflows/paperclip-core-review-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/paperclip-core-review-recovery/**'
      - '.github/workflows/paperclip-core-review-recovery.yml'
concurrency:
  group: paperclip-core-review-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR login for reviewed main only
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test pinned Core overlay
        uses: docker/build-push-action@v6
        with:
          context: ./integrations/paperclip-core-review-recovery
          file: ./integrations/paperclip-core-review-recovery/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/paperclip-review-recovery:${{ github.sha }}
          provenance: true
