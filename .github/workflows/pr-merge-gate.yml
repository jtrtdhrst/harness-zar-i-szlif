name: PR Merge Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-merge-gate.yml'

permissions:
  contents: read

jobs:
  pr-baseline:
    name: PR baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout untrusted source without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changed files without executing PR code
        shell: bash
        run: |
          set -euo pipefail
          # Vendor source is byte-pinned to a reviewed upstream Git tree.
          # Do NOT rewrite the vendor's native whitespace or silently skip validation:
          # validate its complete immutable source tree, then lint all authored paths.
          vendor_changed_paths="$(git diff --name-only HEAD^1 HEAD -- apps/repowise)"
          if [[ -n "$vendor_changed_paths" ]]; then
            python3 -m unittest discover -s scripts -p test_repowise_app_source.py -v
          fi
          git diff --check HEAD^1 HEAD -- . ':(exclude)apps/repowise/**'
          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            case "$file" in
              *.py) python3 -m py_compile "$file" ;;
              *.sh) bash -n "$file" ;;
              *.mjs|*.cjs) node --check "$file" ;;
            esac
          done < <(git diff --name-only -z --diff-filter=ACMR HEAD^1 HEAD -- . ':(exclude)apps/repowise/**')
