name: Opik MCP Access Guard regression

on:
  pull_request:
    paths:
      - 'opik-mcp/**'
      - '.github/workflows/opik-mcp-access-guard.yml'
  push:
    branches: [main]
    paths:
      - 'opik-mcp/**'
      - '.github/workflows/opik-mcp-access-guard.yml'

permissions:
  contents: read

jobs:
  jwt-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install PyJWT==2.10.1 cryptography==46.0.5
      - name: Test verified, forged, expired and wrong-audience JWTs
        run: python -m unittest discover -s opik-mcp/access-guard -p 'test_guard.py' -v
      - name: Build non-root auth guard image
        run: docker build --pull --tag opik-access-guard:test opik-mcp/access-guard
