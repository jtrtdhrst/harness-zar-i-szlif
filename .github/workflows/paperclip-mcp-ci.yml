name: Paperclip MCP CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "paperclip-mcp/**"
      - ".github/workflows/paperclip-mcp-ci.yml"
  workflow_dispatch:

concurrency:
  group: paperclip-mcp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-paperclip-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This job is a required status check. Keep it on every PR, but do not
      # spend several minutes building Paperclip MCP when unrelated files move.
      - name: Detect MCP-impacting changes (fail closed on API errors)
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -Eq '^(paperclip-mcp/|\.github/workflows/paperclip-mcp-ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Unrelated PR: required check passed without Docker build."
          fi
      - uses: actions/checkout@v4
        if: steps.scope.outputs.relevant == 'true'
      - name: Build the production-equivalent MCP image
        if: steps.scope.outputs.relevant == 'true'
        run: docker build --build-arg PAPERCLIP_BASE=ghcr.io/paperclipai/paperclip:2026.1023.0 --file paperclip-mcp/Dockerfile --tag paperclip-mcp-ci:verified paperclip-mcp
      - name: Native Git permissions, review, API and gateway regression
        if: steps.scope.outputs.relevant == 'true'
        run: |
          docker run --rm --entrypoint /bin/sh paperclip-mcp-ci:verified -c '
            set -eu
            mkdir -p /tmp/mcp-ci
            cp -r /opt/paperclip-mcp/src /tmp/mcp-ci/src
            ln -s /app/packages/mcp-server/node_modules /tmp/mcp-ci/node_modules
            cd /tmp/mcp-ci
            /app/node_modules/.bin/vitest run --root /tmp/mcp-ci src/github-app-rotation.test.ts src/git-publication-role.test.ts src/git-credential-projection.test.ts src/p1-git.test.ts src/live-verify.test.ts src/workspace-native.test.ts --maxWorkers=2 --reporter=dot
          '
