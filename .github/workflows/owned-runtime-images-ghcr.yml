name: Owned Harness runtime OCI images - four source roots
on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp/github-mcp/**'
      - 'integrations/hermes-paperclip/gateway/**'
      - 'mcp/multica-mcp/**'
      - 'ops/repowise/**'
      - 'ops/service-build-roots.json'
      - 'scripts/select_owned_runtime_builds.py'
      - 'scripts/test_select_owned_runtime_builds.py'
      - '.github/workflows/owned-runtime-images-ghcr.yml'
  push:
    branches: [main]
    paths:
      - 'ops/service-build-roots.json'
      - 'mcp/github-mcp/**'
      - 'integrations/hermes-paperclip/gateway/**'
      - 'mcp/multica-mcp/**'
      - 'ops/repowise/**'
      - 'scripts/select_owned_runtime_builds.py'
      - '.github/workflows/owned-runtime-images-ghcr.yml'
  workflow_dispatch:
    inputs:
      service:
        required: true
        type: choice
        default: all
        options:
          - all
          - github-ops-mcp
          - hermes-gateway
          - multica-mcp
          - repowise-deployment-publisher-staging

permissions:
  contents: read

jobs:
  source-regressions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify bounded own-root selection and deny unrelated changes
        run: python3 -m unittest discover -s scripts -p 'test_select_owned_runtime_builds.py' -v
      - name: Select only changed PR runtime tests
        id: impacted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          changed=$(git diff --name-only --no-renames "$BASE_SHA" HEAD)
          if printf '%s\n' "$changed" | grep -Eq '^(integrations/hermes-paperclip/gateway/|\.github/workflows/owned-runtime-images-ghcr\.yml$)'; then
            echo "hermes=true" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(mcp/multica-mcp/|\.github/workflows/owned-runtime-images-ghcr\.yml$)'; then
            echo "multica=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build actual patched Hermes runtime from its own folder
        if: steps.impacted.outputs.hermes == 'true'
        run: |
          set -euo pipefail
          docker build --pull -f integrations/hermes-paperclip/gateway/Dockerfile -t hermes-gateway-owned-pr:${{ github.sha }} integrations/hermes-paperclip/gateway
      - name: Verify Hermes Gateway scoped MCP regressions inside patched runtime
        if: steps.impacted.outputs.hermes == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            --mount "type=bind,src=$PWD/integrations/hermes-paperclip/gateway,dst=/tests,readonly" \
            -e PYTHONPATH=/opt/hermes:/opt/hermes/gateway \
            -w /opt/hermes --entrypoint python3 hermes-gateway-owned-pr:${{ github.sha }} \
            -m unittest discover -s /tests/tests -p 'test_*.py' -v
      - name: Run Multica MCP protocol and auth tests
        if: steps.impacted.outputs.multica == 'true'
        run: npm --prefix mcp/multica-mcp test

  select:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select only four source-owned runtime roots
        id: select
        env:
          INPUT_SERVICE: ${{ inputs.service || 'all' }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_select_owned_runtime_builds.py' -v
          python3 scripts/select_owned_runtime_builds.py

  publish:
    needs: select
    if: github.ref == 'refs/heads/main' && needs.select.outputs.matrix != '[]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate exact SHA and Dockerfile inside selected context
        env:
          BUILD_ROOT: ${{ matrix.directory }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jtrtdhrst/harness-zar-i-szlif"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$BUILD_ROOT" != "."
          test "$BUILD_ROOT" != "/"
          test -f "$DOCKERFILE"
          case "$DOCKERFILE" in "$BUILD_ROOT"/*) ;; *) exit 1 ;; esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build selected owned context and publish exact SHA
        uses: docker/build-push-action@v6
        id: image
        with:
          context: ./${{ matrix.directory }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/harness-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Validate digest and emit non-authorizing release evidence
        id: evidence
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SERVICE: ${{ matrix.service }}
          BUILD_ROOT: ${{ matrix.directory }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/harness-${{ matrix.service }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/owned-release"
          python3 - <<'PY'
          import json, os, pathlib
          e = os.environ
          data = {"schema_version": 1, "service": e["SERVICE"],
                  "source_repository": e["GITHUB_REPOSITORY"],
                  "source_sha": e["GITHUB_SHA"],
                  "source_root": e["BUILD_ROOT"],
                  "dockerfile": e["DOCKERFILE"], "image": e["IMAGE"],
                  "image_digest": e["DIGEST"],
                  "subject": e["IMAGE"] + "@" + e["DIGEST"],
                  "release_authorized": False, "production_verified": False}
          pathlib.Path(e["RUNNER_TEMP"], "owned-release", "release.json").write_text(
              json.dumps(data, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "manifest=$RUNNER_TEMP/owned-release/release.json" >> "$GITHUB_OUTPUT"
          echo "$SERVICE exact SHA $GITHUB_SHA image $IMAGE@$DIGEST (NOT DEPLOYED)" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign immutable OCI digest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.evidence.outputs.image }}
          subject-digest: ${{ steps.evidence.outputs.digest }}
      - name: Upload exact immutable image record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owned-runtime-${{ matrix.service }}-${{ github.sha }}
          path: ${{ steps.evidence.outputs.manifest }}
          if-no-files-found: error
          retention-days: 30
