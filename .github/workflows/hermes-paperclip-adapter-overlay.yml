name: Hermes Paperclip Core adapter-only overlay
on:
  pull_request:
    paths:
      - 'integrations/hermes-paperclip/paperclip-core-overlay/**'
      - 'integrations/paperclip-core-review-recovery/**'
      - '.github/workflows/hermes-paperclip-adapter-overlay.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/hermes-paperclip/paperclip-core-overlay/**'
      - '.github/workflows/hermes-paperclip-adapter-overlay.yml'
concurrency:
  group: hermes-paperclip-adapter-overlay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR only for reviewed main releases
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and validate pinned adapter overlay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./integrations/hermes-paperclip/paperclip-core-overlay/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/paperclip-hermes-adapter:${{ github.sha }}
          provenance: true
