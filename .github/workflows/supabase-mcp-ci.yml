name: Supabase MCP source CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp/supabase-mcp/**'
      - '.github/workflows/supabase-mcp-ci.yml'
permissions:
  contents: read
jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run source-only tests and build in disposable container
        run: |
          docker run --rm -v "$PWD/mcp/supabase-mcp:/source:ro" docker.io/oven/bun:1.2.23-alpine@sha256:0841c588f6304300baf1d395ae339ce09a6e18c4b6a7cdd4fddcbdb87a2f096a sh -ec 'cp -R /source/. /tmp/check; cd /tmp/check; bun install --frozen-lockfile --ignore-scripts; bun test src/__tests__/server/auth-middleware.test.ts src/__tests__/server/privilege-policy.test.ts src/__tests__/tools/add_nullable_column.test.ts; bun run build'
