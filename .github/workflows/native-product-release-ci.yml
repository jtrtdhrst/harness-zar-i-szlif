name: Native Product Release Gate CI

on:
  pull_request:
    paths:
      - "scripts/paperclip_native_release_gate.py"
      - "scripts/test_paperclip_native_release_gate.py"
      - "scripts/product_native_promotion.py"
      - "scripts/test_product_native_promotion.py"
      - "ops/systemd/product-native-promotion.*"
      - ".github/workflows/native-product-release-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/paperclip_native_release_gate.py"
      - "scripts/test_paperclip_native_release_gate.py"
      - "scripts/product_native_promotion.py"
      - "scripts/test_product_native_promotion.py"
      - "ops/systemd/product-native-promotion.*"
      - ".github/workflows/native-product-release-ci.yml"

concurrency:
  group: native-product-release-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-native-product-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual native approvals, stale SHA and unreviewed merges fail closed
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_paperclip_native_release_gate.py -v
          python3 -m unittest discover -s scripts -p test_product_native_promotion.py -v
          python3 -m py_compile scripts/paperclip_native_release_gate.py scripts/product_native_promotion.py
