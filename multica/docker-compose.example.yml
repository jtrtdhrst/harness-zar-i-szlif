# Illustrative standalone stack for Multica v0.8.1. Production runs in the
# `multica` Coolify project as `multica-stack`; Coolify owns the full runtime
# environment, Caddy labels and secrets. Do not copy production secrets here.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/multica-ai/multica-backend:v0.8.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MULTICA_PUBLIC_URL: ${MULTICA_PUBLIC_URL:-https://multica.zariszlif.pl}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://multica.zariszlif.pl}
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/data/uploads

  frontend:
    image: ghcr.io/multica-ai/multica-web:v0.8.1
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://multica.zariszlif.pl}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://multica.zariszlif.pl}
      PORT: "3000"
    ports:
      - "3000:3000"

  mailpit:
    image: axllent/mailpit:v1.27.2
    ports:
      - "8025:8025"

volumes:
  pgdata:
  backend-uploads:
