      MP_MAX_MESSAGES: "${MP_MAX_MESSAGES:?supply via Coolify environment}"
    image: axllent/mailpit@sha256:d0ced6db824290cf4fe13c17ae829ed4d4b6ca8e5d3f6901759fab208f42be29
    mem_limit: '268435456'
    ports:
      -
        mode: ingress
        host_ip: 127.0.0.1
        target: 8025
        published: '18325'
        protocol: tcp
    restart: unless-stopped
  postgres:
    cpus: 0.75
    command: null
    entrypoint: null
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?supply via Coolify environment}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?supply via Coolify environment}"
      POSTGRES_USER: "${POSTGRES_USER:?supply via Coolify environment}"
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U multica_poc -d multica_poc'
      timeout: 5s
      interval: 5s
      retries: 5
    image: pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    mem_limit: '805306368'
    restart: unless-stopped
    volumes:
      -
        type: volume
        source: pgdata
        target: /var/lib/postgresql/data
        volume: {  }
volumes:
  pgdata: {  }
  backend_uploads: {  }
