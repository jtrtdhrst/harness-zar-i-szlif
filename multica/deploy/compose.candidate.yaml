    mem_limit: '1610612736'
    ports:
      -
        mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: '18380'
        protocol: tcp
    restart: unless-stopped
    volumes:
      -
        type: volume
        source: backend_uploads
        target: /app/data/uploads
        volume: {  }
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null http://127.0.0.1:8080/health'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
  frontend:
    cpus: 0.75
    command: null
    depends_on:
      backend:
        condition: service_started
        required: true
    entrypoint: null
    environment:
