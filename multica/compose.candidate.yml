networks:
  default:
    ipam:
      config:
        -
          subnet: 10.240.254.0/27
services:
  backend:
    cpus: 1.5
    command: null
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    entrypoint: null
    environment:
      ALLOWED_EMAILS: ''
      ALLOWED_EMAIL_DOMAINS: ''
      ALLOW_SIGNUP: 'true'
      APP_ENV: production
      ATTACHMENT_DOWNLOAD_MODE: auto
      ATTACHMENT_DOWNLOAD_URL_TTL: 30m
      AWS_ACCESS_KEY_ID: ''
      AWS_ENDPOINT_URL: ''
      AWS_SECRET_ACCESS_KEY: ''
      CLOUDFRONT_DOMAIN: ''
      CLOUDFRONT_KEY_PAIR_ID: ''
      CLOUDFRONT_PRIVATE_KEY: ''
      COOKIE_DOMAIN: ''
      CORS_ALLOWED_ORIGINS: 'https://multica.zariszlif.pl'
      DATABASE_REPLICA_MAX_CONNS: ''
      DATABASE_REPLICA_MIN_CONNS: ''
      DATABASE_REPLICA_URL: ''
      DATABASE_SEARCH_WORK_MEM_MB: '64'
      DATABASE_URL: "${DATABASE_URL:?Use existing scoped Coolify DATABASE_URL secret}"
      DISABLE_WORKSPACE_CREATION: ''
      DO_NOT_TRACK: '1'
      FRONTEND_ORIGIN: 'https://multica.zariszlif.pl'
      GITHUB_APP_ID: '${GITHUB_APP_ID:-}'
      GITHUB_APP_SLUG: '${GITHUB_APP_SLUG:-}'
      GITHUB_WEBHOOK_SECRET: '${GITHUB_WEBHOOK_SECRET:-}'
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      GOOGLE_REDIRECT_URI: 'http://localhost:3000/auth/callback'
      JWT_SECRET: "${JWT_SECRET:?Set runtime secret}"
      MAINTENANCE_PORT: ''
      METRICS_ADDR: ''
      MULTICA_APP_URL: 'https://multica.zariszlif.pl'
      MULTICA_CLOUD_URL: ''
      MULTICA_DAEMON_SERVER_URL: 'https://multica.zariszlif.pl'
      MULTICA_DATABASE_CONNECT_TIMEOUT: 5s
      MULTICA_DATABASE_STARTUP_TIMEOUT: 3m
      MULTICA_DEV_VERIFICATION_CODE: ''
      MULTICA_DINGTALK_SECRET_KEY: ''
      MULTICA_LARK_CALLBACK_BASE_URL: ''
      MULTICA_LARK_HTTP_BASE_URL: ''
      MULTICA_LARK_SECRET_KEY: ''
      MULTICA_LLM_API_KEY: ''
      MULTICA_LLM_BASE_URL: ''
      MULTICA_LLM_DEFAULT_MODEL: ''
      MULTICA_LLM_DISABLE_THINKING: ''
      MULTICA_LLM_MAX_RETRIES: ''
      MULTICA_MAX_PREVIEW_SIZE: 2MiB
      MULTICA_PLUGIN_API_URL: ''
      MULTICA_PLUGIN_DIR: ''
      MULTICA_PLUGIN_SECRET_KEY: ''
      MULTICA_PLUGIN_SURFACE_ORIGIN: ''
      MULTICA_PUBLIC_URL: 'https://multica.zariszlif.pl'
      MULTICA_RUNTIME_RECONNECT_GRACE: ''
      MULTICA_SHUTDOWN_HOLD_DURATION: ''
      MULTICA_SLACK_SECRET_KEY: ''
      MULTICA_TELEGRAM_SECRET_KEY: ''
      MULTICA_TRUSTED_PROXIES: ''
      MULTICA_VCS_INTEGRATION_ENABLED: 'true'
      MULTICA_VCS_SECRET_KEY: "${MULTICA_VCS_SECRET_KEY:?Set runtime secret}"
      MULTICA_WECOM_DEFAULT_LOCALE: ''
      MULTICA_WECOM_MEDIA_ALLOW_CIDRS: ''
      MULTICA_WECOM_SECRET_KEY: ''
      MULTICA_WECOM_SOURCE_ID: ''
      MULTICA_WECOM_TRACE: ''
      PORT: '8080'
      REDIS_CLUSTER_MODE: 'false'
      REDIS_URL: ''
      RESEND_API_KEY: ''
      RESEND_FROM_EMAIL: noreply@multica.ai
      S3_BUCKET: ''
      S3_REGION: us-west-2
      S3_USE_PATH_STYLE: ''
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@zariszlif.pl}
      SMTP_HOST: ${SMTP_HOST:-smtp.mx.cloudflare.net}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_TLS: ${SMTP_TLS:-implicit}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-api_token}
      WORKSPACE_CREATION_ALLOWED_EMAILS: ''
    image: "${PINNED_IMAGE_MULTICA_STACK_1:?Set reviewed immutable OCI digest}"
    mem_limit: '1610612736'
    ports:
      -
        mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: '18380'
        protocol: tcp
    restart: unless-stopped
    volumes:
      -
        type: volume
        source: backend_uploads
        target: /app/data/uploads
        volume: {  }
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null http://127.0.0.1:8080/health'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
  frontend:
    cpus: 0.75
    command: null
    depends_on:
      backend:
        condition: service_started
        required: true
    entrypoint: null
    environment:
      DOCS_URL: 'https://multica.ai'
      GOOGLE_ANALYTICS_ID: ''
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ''
      NEXT_PUBLIC_WS_URL: ''
      REMOTE_API_URL: 'http://backend:8080'
    image: "${PINNED_IMAGE_MULTICA_STACK_2:?Set reviewed immutable OCI digest}"
    mem_limit: '805306368'
    ports:
      -
        mode: ingress
        host_ip: 127.0.0.1
        target: 3000
        published: '18300'
        protocol: tcp
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null http://127.0.0.1:3000/'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
  mailpit:
    cpus: 0.3
    command: null
    entrypoint: null
    environment:
      MP_MAX_MESSAGES: '150'
    image: "${PINNED_IMAGE_MULTICA_STACK_3:?Set reviewed immutable OCI digest}"
    mem_limit: '268435456'
    ports:
      -
        mode: ingress
        host_ip: 127.0.0.1
        target: 8025
        published: '18325'
        protocol: tcp
    restart: unless-stopped
  postgres:
    cpus: 0.75
    command: null
    entrypoint: null
    environment:
      POSTGRES_DB: multica_poc
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set runtime secret}"
      POSTGRES_USER: multica_poc
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U multica_poc -d multica_poc'
      timeout: 5s
      interval: 5s
      retries: 5
    image: "${PINNED_IMAGE_MULTICA_STACK_4:?Set reviewed immutable OCI digest}"
    mem_limit: '805306368'
    restart: unless-stopped
    volumes:
      -
        type: volume
        source: pgdata
        target: /var/lib/postgresql/data
        volume: {  }
volumes:
  pgdata: {  }
  backend_uploads: {  }
