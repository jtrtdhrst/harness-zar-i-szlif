      POSTGRES_HOST: "${POSTGRES_HOST:?supply via Coolify environment}"
      POSTGRES_DB: "${POSTGRES_DB:?supply via Coolify environment}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?supply via Coolify environment}"
