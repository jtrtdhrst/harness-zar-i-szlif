      GOTRUE_DISABLE_SIGNUP: "${GOTRUE_DISABLE_SIGNUP:?supply via Coolify environment}"
      GOTRUE_JWT_ADMIN_ROLES: "${GOTRUE_JWT_ADMIN_ROLES:?supply via Coolify environment}"
      GOTRUE_JWT_AUD: "${GOTRUE_JWT_AUD:?supply via Coolify environment}"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: "${GOTRUE_JWT_DEFAULT_GROUP_NAME:?supply via Coolify environment}"
      GOTRUE_JWT_EXP: "${GOTRUE_JWT_EXP:?supply via Coolify environment}"
      GOTRUE_JWT_SECRET: "${GOTRUE_JWT_SECRET:?supply via Coolify environment}"
      GOTRUE_JWT_KEYS: "${GOTRUE_JWT_KEYS:?supply via Coolify environment}"
      GOTRUE_JWT_ISSUER: "${GOTRUE_JWT_ISSUER:?supply via Coolify environment}"
