      SUPABASE_PUBLIC_URL: "${SUPABASE_PUBLIC_URL:?supply via Coolify environment}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:?supply via Coolify environment}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY:?supply via Coolify environment}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?supply via Coolify environment}"
      SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:?supply via Coolify environment}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:?supply via Coolify environment}"
