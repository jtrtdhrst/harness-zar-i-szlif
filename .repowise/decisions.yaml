- id: 787a387aabb5321888b171204792bbc3
  title: Agents use RepoWise for code facts and Hindsight for execution experience
  decision: Use the Multica workspace MCP library as the single definition for repowise and hindsight-<role>;
    keep agent.mcp_config only for role-specific extras. RepoWise is the first tool for code, structure
    and impact questions behind a freshness gate; Hindsight is the only store for verified execution experience,
    with one recall at task start and one retain after a verified outcome. Do not store code or runtime
    facts in Hindsight, and do not treat RepoWise as proof of runtime state. Policy lives in one workspace
    skill plus a short instruction line; adoption is measured in Opik.
  reason: Multica source (ResolveAgentMcpConfig, mergeRuntimeAndAgentMcpConfig) gives deterministic precedence
    and reads config on every claim, so consolidation needs no restart and is reversible. Duplicate definitions
    already shadow the library, causing token and URL drift. The tools are unused because no policy references
    them, and stale code plus synthetic memory make adoption unsafe until both are fixed.
  scope:
  - docs/architecture/BACKEND-ARCHITECTURE-2026-11-09.md
  - docs/knowledge/AGENT-LOOKUP.md
  - multica-mcp
