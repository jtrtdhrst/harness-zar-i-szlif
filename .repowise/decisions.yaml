- id: 46eb422a82e20da53d497f214108e8d2
  title: ZARI release evidence requires exact SHA, per-service gates and live E2E
  decision: 'For each affected service use one release chain: exact GitHub merged PR/head and main SHA
    -> trustworthy isolated CI or source-scoped verified attestation -> independent exact-SHA approval
    -> authorized per-UUID promotion -> immutable image digest -> Coolify deployment ID -> live SHA/digest/health
    readback -> authenticated positive and negative E2E -> issue Done. Non-runtime documentation or CI-only
    changes get explicit source-only acceptance and must not deploy an unchanged image. Existing HOLD
    or isolation restrictions remain fail-closed. RepoWise records repository facts and decisions but
    neither deploys nor grants approval.'
  reason: Live root controller exits missing_or_ambiguous_main_pr every scheduled attempt; passing PR/local
    tests and a current RepoWise index do not prove a production update. Distinct GitHub, Multica, Coolify
    and runtime evidence prevents a false DONE and unnecessary deploys. This record is agent-signed, not
    independent CTO review or owner release approval.
  scope:
  - ops/repowise/README.md
  - scripts/harness_delivery_controller.py
  - scripts/product_native_promotion.py
