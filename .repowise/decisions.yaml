- id: d3a0622352237466926c85bb65632a56
  title: RepoWise is the canonical architecture knowledge index for Żar i Szlif
  decision: Maintain durable architecture and operational integration documentation in the harness Git
    repository under docs/architecture, and make it discoverable through the existing RepoWise workspace
    index. Multica tasks are execution evidence only. RepoWise tracks source-code structure and decisions;
    Hindsight stores scoped agent episode memory, not codebase documentation.
  reason: Keeps one version-controlled truth attached to the two indexed repositories; prevents conflicting
    agent task descriptions, memory banks and transient VPS notes from becoming architecture sources of
    truth.
