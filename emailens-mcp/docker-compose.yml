services:
  emailens-mcp:
    build: .
    image: local/emailens-mcp:0.10.0
    restart: unless-stopped
    env_file: .env
    environment:
      EMAILENS_BRIDGE_TOKEN: ${EMAILENS_BRIDGE_TOKEN:?EMAILENS_BRIDGE_TOKEN is required}
      PORT: "3100"
      MCP_PATH: /mcp
      IDLE_SECONDS: "600"
    expose:
      - "3100"
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"require('net').connect(3100,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
