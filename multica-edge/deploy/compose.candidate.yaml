# Snapshot of live Coolify Compose; image pinned to locally observed immutable RepoDigest.
# NOT APPROVED FOR DEPLOYMENT. No production image/digest release or E2E verification yet.
services:
  cloudflared:
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20242", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${MULTICA_TUNNEL_TOKEN}
    network_mode: host
    restart: unless-stopped
