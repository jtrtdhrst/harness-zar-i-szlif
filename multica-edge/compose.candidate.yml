services:
  cloudflared:
    image: "${PINNED_IMAGE_MULTICA_EDGE_1:?Set reviewed immutable OCI digest}"
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20242", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${MULTICA_TUNNEL_TOKEN}
    network_mode: host
    restart: unless-stopped
