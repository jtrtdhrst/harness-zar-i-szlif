services:
  qdrant:
    image: qdrant/qdrant:1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    restart: unless-stopped
    expose:
    - '6333'
    - '6334'
    volumes:
    - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '</dev/tcp/127.0.0.1/6333'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    ports:
    - 0.0.0.0:6333:6333
volumes:
  qdrant_storage: null
