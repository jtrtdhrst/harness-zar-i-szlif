# Sanitized live Coolify snapshot. NOT APPROVED FOR DEPLOYMENT.
# This is an upstream/local image Compose CANDIDATE, not a verified own-source Docker build.
# Preserve live env, stateful mounts, ingress and network; require verified OCI digest, source review, E2E and rollback.
services:
  opencode:
    init: true
    networks:
      - default
      - coolify
    image: "${OPENCODE_IMAGE_DIGEST:?publish owned image digest}"
    pull_policy: build
    restart: unless-stopped
    command:
      - serve
      - '--hostname'
      - 0.0.0.0
      - '--port'
      - '4096'
    ports:
      - '127.0.0.1:4096:4096'
    environment:
      HOME: "${HOME:?required Coolify variable}"
      DOCKER_HOST: "${DOCKER_HOST:?required Coolify variable}"
      OPENCODE_SERVER_USERNAME: "${OPENCODE_SERVER_USERNAME:?required Coolify variable}"
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:?required Coolify variable}"
      OPENCODE_PASSWORD: "${OPENCODE_PASSWORD:?required Coolify variable}"
    volumes:
      - '/home/opencode/server/recovery-secrets/paperclip-agent-key:/root/.paperclip-agent-key:ro'
      - '/home/opencode/server/recovery-secrets/paperclip-board-key:/root/.paperclip-board-key:ro'
      - '/home/opencode/server/recovery-secrets/paperclip-company-id:/root/.paperclip-company-id:ro'
      - '/home/opencode/projects:/home/opencode/projects'
      - '/home/opencode/server/cache:/root/.cache/opencode'
      - '/home/opencode/server/config:/root/.config/opencode'
      - '/run/user/1001/docker.sock:/var/run/docker.sock'
      - '/home/opencode/server/data:/root/.local/share/opencode'
      - "${OPENCODE_SENSITIVE_BIND:?manually reconcile existing host bind path}"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"require('net').connect(4096,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  oauth-callback-proxy:
    image: alpine/socat@sha256:603174b77eebaba25ba8f8ebb15e1234d6600409554e95d6fb203fd106150287
    restart: unless-stopped
    command:
      - 'TCP-LISTEN:19876,fork,reuseaddr'
      - 'TCP:opencode:19877'
    ports:
      - '127.0.0.1:19876:19876'
    depends_on:
      - opencode
    healthcheck:
      test:
        - CMD-SHELL
        - 'nc -z 127.0.0.1 19876'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  oauth-loopback-bridge:
    image: alpine/socat@sha256:603174b77eebaba25ba8f8ebb15e1234d6600409554e95d6fb203fd106150287
    restart: unless-stopped
    entrypoint:
      - sh
      - /bridge.sh
    network_mode: 'service:opencode'
    pid: 'service:opencode'
    volumes:
      - '/home/opencode/server/config/oauth-callback-bridge.sh:/bridge.sh:ro'
    depends_on:
      - opencode
    healthcheck:
      test:
        - CMD-SHELL
        - 'pgrep -f bridge.sh >/dev/null'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  default: {}
  coolify:
    external: true
