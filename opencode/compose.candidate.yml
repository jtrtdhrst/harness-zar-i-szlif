services:
  opencode:
    init: true
    # source build withheld until reproducible source exists
    networks:
      - default
      - coolify
    image: "${PINNED_IMAGE_OPENCODE_1:?Set reviewed immutable OCI digest}"
    pull_policy: build
    restart: unless-stopped
    command:
      - serve
      - '--hostname'
      - 0.0.0.0
      - '--port'
      - '4096'
    ports:
      - '127.0.0.1:4096:4096'
    environment:
      HOME: /root
      DOCKER_HOST: 'unix:///var/run/docker.sock'
      OPENCODE_SERVER_USERNAME: '${OPENCODE_SERVER_USERNAME}'
      OPENCODE_SERVER_PASSWORD: '${OPENCODE_SERVER_PASSWORD}'
      OPENCODE_PASSWORD: "${OPENCODE_PASSWORD}"
    volumes:
      - '/home/opencode/server/recovery-secrets/paperclip-agent-key:/root/.paperclip-agent-key:ro'
      - '/home/opencode/server/recovery-secrets/paperclip-board-key:/root/.paperclip-board-key:ro'
      - '/home/opencode/server/recovery-secrets/paperclip-company-id:/root/.paperclip-company-id:ro'
      - '/home/opencode/projects:/home/opencode/projects'
      - '/home/opencode/server/cache:/root/.cache/opencode'
      - '/home/opencode/server/config:/root/.config/opencode'
      - '/run/user/1001/docker.sock:/var/run/docker.sock'
      - '/home/opencode/server/data:/root/.local/share/opencode'
      - '/home/opencode/server/recovery-secrets/od-api-token:/root/design-stack/.secrets/od-api-token:ro'
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"require('net').connect(4096,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  oauth-callback-proxy:
    image: "${PINNED_IMAGE_OPENCODE_2:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    command:
      - 'TCP-LISTEN:19876,fork,reuseaddr'
      - 'TCP:opencode:19877'
    ports:
      - '127.0.0.1:19876:19876'
    depends_on:
      - opencode
    healthcheck:
      test:
        - CMD-SHELL
        - 'nc -z 127.0.0.1 19876'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  oauth-loopback-bridge:
    image: "${PINNED_IMAGE_OPENCODE_3:?Set reviewed immutable OCI digest}"
    restart: unless-stopped
    entrypoint:
      - sh
      - /bridge.sh
    network_mode: 'service:opencode'
    pid: 'service:opencode'
    volumes:
      - '/home/opencode/server/config/oauth-callback-bridge.sh:/bridge.sh:ro'
    depends_on:
      - opencode
    healthcheck:
      test:
        - CMD-SHELL
        - 'pgrep -f bridge.sh >/dev/null'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  default: {}
  coolify:
    external: true
